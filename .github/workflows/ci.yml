name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  backend:
    name: UserFront (Spring Boot) build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UserFront
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B test

  frontend:
    name: AdminPortal (Angular) build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdminPortal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AdminPortal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npx ng build

      - name: Unit tests (Karma/Jasmine)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  e2e:
    name: AdminPortal (Angular) e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdminPortal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AdminPortal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test
