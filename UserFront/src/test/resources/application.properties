# ===============================
# = TEST DATA SOURCE
# ===============================
# Mirrors src/main/resources/application.properties but disables the JDBC SSL
# handshake. The pinned MySQL Connector/J (5.1.42, from Spring Boot 1.5.4) only
# negotiates TLSv1/TLSv1.1, which modern JDKs disable by default, so an SSL
# connection to a MySQL 8.x server fails during tests. useSSL=false keeps the
# existing driver/DB working without touching production config or versions.
spring.datasource.url = jdbc:mysql://localhost:3306/onlinebanking?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username = root
spring.datasource.password = avengers1993

spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
