# ===============================
# = TEST DATA SOURCE (in-memory)
# ===============================

# USER is a reserved keyword in H2 2.x, so it is excluded to keep the User entity mapping valid
spring.datasource.url = jdbc:h2:mem:userfront;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql = false
