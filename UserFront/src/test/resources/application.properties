# ===============================
# = TEST DATA SOURCE (in-memory H2)
# ===============================
# Integration tests run against an in-memory H2 database so no external
# MySQL instance is required in CI.

# Mirror the production setting: allow the mutual service-layer dependencies
# that Spring Boot 2.6+ rejects by default.
spring.main.allow-circular-references = true

spring.datasource.url = jdbc:h2:mem:onlinebanking;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username = sa
spring.datasource.password =
spring.datasource.driver-class-name = org.h2.Driver

spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.jpa.show-sql = false
