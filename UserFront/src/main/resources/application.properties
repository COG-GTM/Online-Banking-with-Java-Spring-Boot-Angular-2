# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection

# Connection url for the database "netgloo_blog"
spring.datasource.url = jdbc:mysql://localhost:3306/onlinebanking

# Username and secret
spring.datasource.username = root
spring.datasource.password = avengers1993

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.hikari.keepalive-time = 300000
spring.datasource.hikari.connection-test-query = SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager).

# Show or not log for each sql query
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update): with "update" the database
# schema will be automatically updated accordingly to java entities found in
# the project
spring.jpa.hibernate.ddl-auto = update

# Hibernate 6 auto-detects the MySQL dialect/version from the JDBC connection

# Keep Open Session In View enabled (Boot 1.5 default) without the startup warning
spring.jpa.open-in-view = true

# The DaoAuthenticationProvider bean in SecurityConfig intentionally wires UserSecurityService
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer = ERROR
