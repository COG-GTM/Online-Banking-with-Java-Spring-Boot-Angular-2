spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/onlinebanking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Show SQL for local debugging
spring.jpa.show-sql=true

# In dev, allow Hibernate to update the schema to ease iteration
spring.jpa.hibernate.ddl-auto=update

# Allowed CORS origin for the Angular dev server
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
